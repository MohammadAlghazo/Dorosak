name: dorosak

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${DOROSAK_POSTGRES_DATABASE:-dorosak_dev}
      POSTGRES_USER: dorosak_owner
      POSTGRES_PASSWORD: ${DOROSAK_POSTGRES_OWNER_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${DOROSAK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username dorosak_owner --dbname $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:8.10.0@sha256:39353c6a2f310da333374e1290c91805d15a85def073b5090f58e4ac646d284c
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lfu
      - --requirepass
      - ${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
    environment:
      REDISCLI_AUTH: ${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${DOROSAK_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 384m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DOROSAK_MINIO_ROOT_USER:?Run Initialize-LocalEnvironment.ps1 first}
      MINIO_ROOT_PASSWORD: ${DOROSAK_MINIO_ROOT_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${DOROSAK_MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${DOROSAK_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:${DOROSAK_MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${DOROSAK_MAILPIT_UI_PORT:-8026}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
    ports:
      - "127.0.0.1:${DOROSAK_CLAMAV_PORT:-3311}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    mem_limit: 2g
    cpus: 2
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/src/Dorosak.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${DOROSAK_POSTGRES_DATABASE:-dorosak_dev};Username=dorosak_app;Password=${DOROSAK_POSTGRES_APP_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first};SSL Mode=Disable;Channel Binding=Disable;Include Error Detail=false;Timeout=15;Command Timeout=30;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=20;Connection Idle Lifetime=300;Keepalive=30"
      ConnectionStrings__Redis: redis:6379,password=${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first},abortConnect=false
      ConnectionStrings__RedisSecurity: redis:6379,password=${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first},abortConnect=false
      App__PublicUrl: ${DOROSAK_PUBLIC_URL:-http://localhost:4200}
      Licensing__MediatRKey: ${DOROSAK_MEDIATR_LICENSE_KEY:-}
      Licensing__AutoMapperKey: ${DOROSAK_AUTOMAPPER_LICENSE_KEY:-}
      OpenTelemetry__Endpoint: ${DOROSAK_OTEL_ENDPOINT:-}
      Media__Storage__Enabled: "true"
      Media__Storage__Endpoint: http://minio:9000
      Media__Storage__PublicEndpoint: http://localhost:${DOROSAK_MINIO_API_PORT:-9100}
      Media__Storage__Bucket: dorosak-media
      Media__Storage__AccessKey: ${DOROSAK_MINIO_ROOT_USER:?Run Initialize-LocalEnvironment.ps1 first}
      Media__Storage__SecretKey: ${DOROSAK_MINIO_ROOT_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
      Media__Storage__CreateBucketIfMissing: "true"
      Media__Cloudinary__Enabled: ${DOROSAK_CLOUDINARY_ENABLED:-false}
      Media__Cloudinary__CloudName: ${DOROSAK_CLOUDINARY_CLOUD_NAME:-}
      Media__Cloudinary__ApiKey: ${DOROSAK_CLOUDINARY_API_KEY:-}
      Media__Cloudinary__ApiSecret: ${DOROSAK_CLOUDINARY_API_SECRET:-}
      HOME: /tmp
    ports:
      - "127.0.0.1:${DOROSAK_API_PORT:-5053}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/src/Dorosak.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${DOROSAK_POSTGRES_DATABASE:-dorosak_dev};Username=dorosak_app;Password=${DOROSAK_POSTGRES_APP_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first};SSL Mode=Disable;Channel Binding=Disable;Include Error Detail=false;Timeout=15;Command Timeout=30;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=20;Connection Idle Lifetime=300;Keepalive=30"
      ConnectionStrings__Redis: redis:6379,password=${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first},abortConnect=false
      App__PublicUrl: ${DOROSAK_PUBLIC_URL:-http://localhost:4200}
      Email__SmtpHost: mailpit
      Email__SmtpPort: 1025
      Email__UseTls: false
      Licensing__MediatRKey: ${DOROSAK_MEDIATR_LICENSE_KEY:-}
      Licensing__AutoMapperKey: ${DOROSAK_AUTOMAPPER_LICENSE_KEY:-}
      OpenTelemetry__Endpoint: ${DOROSAK_OTEL_ENDPOINT:-}
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  media-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/src/Dorosak.MediaWorker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${DOROSAK_POSTGRES_DATABASE:-dorosak_dev};Username=dorosak_app;Password=${DOROSAK_POSTGRES_APP_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first};SSL Mode=Disable;Channel Binding=Disable;Include Error Detail=false;Timeout=15;Command Timeout=30;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=20;Connection Idle Lifetime=300;Keepalive=30"
      ConnectionStrings__Redis: redis:6379,password=${DOROSAK_REDIS_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first},abortConnect=false
      Media__Storage__Enabled: "true"
      Media__Storage__Endpoint: http://minio:9000
      Media__Storage__PublicEndpoint: http://localhost:${DOROSAK_MINIO_API_PORT:-9100}
      Media__Storage__Bucket: dorosak-media
      Media__Storage__AccessKey: ${DOROSAK_MINIO_ROOT_USER:?Run Initialize-LocalEnvironment.ps1 first}
      Media__Storage__SecretKey: ${DOROSAK_MINIO_ROOT_PASSWORD:?Run Initialize-LocalEnvironment.ps1 first}
      Media__Storage__CreateBucketIfMissing: "true"
      Media__Cloudinary__Enabled: ${DOROSAK_CLOUDINARY_ENABLED:-false}
      Media__Cloudinary__CloudName: ${DOROSAK_CLOUDINARY_CLOUD_NAME:-}
      Media__Cloudinary__ApiKey: ${DOROSAK_CLOUDINARY_API_KEY:-}
      Media__Cloudinary__ApiSecret: ${DOROSAK_CLOUDINARY_API_SECRET:-}
      Media__ClamAV__Host: clamav
      Media__ClamAV__Port: 3310
      Licensing__MediatRKey: ${DOROSAK_MEDIATR_LICENSE_KEY:-}
      Licensing__AutoMapperKey: ${DOROSAK_AUTOMAPPER_LICENSE_KEY:-}
      OpenTelemetry__Endpoint: ${DOROSAK_OTEL_ENDPOINT:-}
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=12g,uid=1654,gid=1654,mode=1700
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
  clamav-db:
